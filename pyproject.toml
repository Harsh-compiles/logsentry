[project]
name = "logsentry"
version = "1.0.0"
description = "Lightweight security monitoring (mini SIEM): log collection, attack detection, alerting and a live dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harshith Pankaja Mahendra" }]
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
