# /etc/rsyslog.d/10-logsentry-receiver.conf  (on the MONITOR server)
# Accepts logs from the monitored machines over TCP 514 and writes them,
# with microsecond RFC 3339 timestamps, to one file that LogSentry tails.

module(load="imtcp")
input(type="imtcp" port="514" ruleset="remote")

ruleset(name="remote") {
    action(type="omfile"
           file="/var/log/remote/remote.log"
           template="RSYSLOG_FileFormat"
           fileCreateMode="0644"
           dirCreateMode="0755")
    stop
}
