# /etc/rsyslog.d/10-logsentry-forward.conf  (on every MONITORED machine)
# Sends every log message to the monitor over TCP. The file name starts with
# "10-" on purpose: Ubuntu's 20-ufw.conf ends with "stop", so a forwarder that
# runs after it would never see the firewall logs.
#
# A disk-assisted queue keeps logs safe if the monitor is briefly unreachable.

*.* action(type="omfwd"
           target="MONITOR_IP" port="514" protocol="tcp"
           template="RSYSLOG_ForwardFormat"
           action.resumeRetryCount="-1"
           queue.type="LinkedList" queue.filename="logsentry_fwd"
           queue.maxDiskSpace="200m" queue.saveOnShutdown="on")
